[project]
name = "inventory"
version = "0.1.0"
description = "Tool inventory for Hackerspace Valencia. Practice repo for the agentic AI course."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "openai>=3.22.0",
]

[project.scripts]
inventory = "inventory.__main__:main"
inventory-mcp = "inventory.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# `uv run pytest` tests the inventory; the session 2 agent has its own tests:
# `uv run pytest agent`.
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
